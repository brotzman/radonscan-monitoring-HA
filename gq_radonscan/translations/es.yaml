configuration:
  device_name:
    name: Nombre del dispositivo
    description: Nombre mostrado del RadonScan en Home Assistant y en la interfaz web.
  scan_interval:
    name: Intervalo de consulta
    description: Segundos entre consultas SPIR de solo lectura.
  preferred_unit:
    name: Unidad preferida
    description: Unidad utilizada en Home Assistant y en la interfaz web.
  language:
    name: Idioma
    description: Idioma de la interfaz Ingress y del manual enlazado.
  warning_threshold_bq_m3:
    name: Umbral de aviso
    description: Valor de radón en Bq/m³ a partir del cual se muestra el estado de aviso.
  danger_threshold_bq_m3:
    name: Umbral de peligro
    description: Valor de radón en Bq/m³ a partir del cual se muestra el estado de peligro.
  factor_bq_m3_per_cph:
    name: Factor de conversión CPH
    description: Factor experimental en Bq/m³ por count/h; se guarda con cada medición.
  backfill_history:
    name: Importar historial del dispositivo
    description: Importa los valores horarios completos ya guardados en el dispositivo tras la primera lectura correcta.
  history_retention_days:
    name: Periodo de conservación
    description: Elimina mediciones locales de SQLite después de este número de días.
  serial_port:
    name: Puerto serie
    description: Déjelo vacío para detección automática o indique una ruta fija del dispositivo.
  serial_timeout_seconds:
    name: Tiempo de espera serie
    description: Número máximo de segundos para esperar una respuesta del dispositivo.
  mqtt_topic_prefix:
    name: Prefijo de temas MQTT
    description: Tema base para mensajes de estado y disponibilidad.
  discovery_prefix:
    name: Prefijo de descubrimiento
    description: Prefijo utilizado por los temas de descubrimiento MQTT de Home Assistant.
  diagnostic_logging:
    name: Registro de diagnóstico detallado
    description: Registra detalles adicionales de detección de puertos, lecturas SPIR y decodificación.
  log_level:
    name: Nivel de registro
    description: Cantidad de detalle del registro de la aplicación.
  minimum_data_coverage_percent:
    name: Cobertura mínima de datos
    description: Porcentaje requerido de valores horarios disponibles antes de considerar calculable un promedio.
  report_author:
    name: Autor del informe
    description: Nombre opcional del autor de los informes científicos en PDF.
  report_organisation:
    name: Organización
    description: Organización o institución opcional para los informes PDF.
  report_disclaimer:
    name: Aviso adicional del informe
    description: Aviso personalizado opcional incluido en los informes científicos PDF.
  gmcmap_max_age_hours:
    name: Antigüedad máxima para World Map
    description: Antigüedad máxima de las mediciones en cola para su envío.
  gmcmap_retry_limit:
    name: Límite de reintentos de World Map
    description: Número máximo de intentos antes de marcar una medición como fallida.
  analysis_timezone:
    name: Zona horaria de análisis
    description: Zona horaria IANA para perfiles diarios, semanales y horarios; auto usa Home Assistant.
  gmcmap_enabled:
    name: Activar GQ World Map
    description: Activa la transmisión a GQ Radiation World Map.
  gmcmap_auto_upload:
    name: Envío automático a World Map
    description: Añade automáticamente a la cola los valores horarios completos.
  gmcmap_account_id:
    name: ID de cuenta de GQ World Map
    description: ID de cuenta utilizado por el servicio de envío de GQ Radiation World Map.
  gmcmap_device_id:
    name: ID de dispositivo de GQ World Map
    description: ID de dispositivo utilizado por el servicio de envío de GQ Radiation World Map.
  gmcmap_upload_interval_minutes:
    name: Intervalo de envío a World Map
    description: Intervalo mínimo en minutos entre envíos automáticos.
  data_management_enabled:
    name: Activar gestión de datos
    description: Muestra la gestión de datos en la barra lateral y habilita sus API protegidas.
  homeassistant_access_token:
    name: Token de administrador de Home Assistant
    description: Token de acceso de larga duración opcional de un administrador de Home Assistant, usado solo para borrar el historial del Recorder.
