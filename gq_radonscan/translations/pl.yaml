configuration:
  device_name:
    name: Nazwa urządzenia
    description: Nazwa RadonScana wyświetlana w Home Assistant i w interfejsie WWW.
  scan_interval:
    name: Interwał odczytu
    description: Liczba sekund między odczytami SPIR wykonywanymi tylko do odczytu.
  preferred_unit:
    name: Preferowana jednostka
    description: Jednostka używana w Home Assistant i w interfejsie WWW.
  language:
    name: Język
    description: Język interfejsu ingress i powiązanego podręcznika.
  warning_threshold_bq_m3:
    name: Próg ostrzegawczy
    description: Wartość radonu w Bq/m³, od której wyświetlany jest stan ostrzegawczy.
  danger_threshold_bq_m3:
    name: Próg zagrożenia
    description: Wartość radonu w Bq/m³, od której wyświetlany jest stan zagrożenia.
  factor_bq_m3_per_cph:
    name: Współczynnik przeliczeniowy CPH
    description: Eksperymentalny współczynnik w Bq/m³ na count/h; zapisywany z każdym pomiarem.
  backfill_history:
    name: Importuj historię urządzenia
    description: Po pierwszym udanym odczycie importuje zapisane w urządzeniu ukończone wartości godzinowe.
  history_retention_days:
    name: Okres przechowywania
    description: Usuwa lokalne pomiary z SQLite po podanej liczbie dni.
  serial_port:
    name: Port szeregowy
    description: Pozostaw puste, aby wykrywać automatycznie, albo podaj stałą ścieżkę urządzenia.
  serial_timeout_seconds:
    name: Limit czasu portu szeregowego
    description: Maksymalny czas oczekiwania na odpowiedź urządzenia, w sekundach.
  mqtt_topic_prefix:
    name: Prefiks tematów MQTT
    description: Temat bazowy dla komunikatów stanu i dostępności.
  discovery_prefix:
    name: Prefiks Discovery
    description: Prefiks tematów Home Assistant MQTT Discovery.
  diagnostic_logging:
    name: Szczegółowe logowanie diagnostyczne
    description: Zapisuje dodatkowe dane techniczne o portach, odczytach SPIR i dekodowaniu.
  log_level:
    name: Poziom logowania
    description: Szczegółowość dziennika aplikacji.
  minimum_data_coverage_percent:
    name: Minimum data coverage
    description: Required percentage of available hourly values before a period average is considered calculable.
  report_author:
    name: Report author
    description: Optional author name for scientific PDF reports.
  report_organisation:
    name: Organisation
    description: Optional organisation or institution for PDF reports.
  report_disclaimer:
    name: Additional report notice
    description: Optional custom notice included in scientific PDF reports.
  gmcmap_max_age_hours:
    name: World Map maximum data age
    description: Maximum age of readings queued for upload.
  gmcmap_retry_limit:
    name: World Map retry limit
    description: Maximum number of upload attempts before a reading is marked failed.
  analysis_timezone:
    name: Analysis time zone
    description: IANA time zone used for day, weekday and hourly profiles; auto uses Home Assistant.
  gmcmap_enabled:
    name: Enable GQ World Map
    description: Enable transmission to the GQ Radiation World Map.
  gmcmap_auto_upload:
    name: Automatic World Map upload
    description: Automatically queue completed hourly values for upload.
  gmcmap_account_id:
    name: GQ World Map account ID
    description: Account ID used by the GQ Radiation World Map upload endpoint.
  gmcmap_device_id:
    name: GQ World Map device ID
    description: Device ID used by the GQ Radiation World Map upload endpoint.
  gmcmap_upload_interval_minutes:
    name: World Map upload interval
    description: Minimum interval in minutes between automatic uploads.
  data_management_enabled:
    name: Enable data management
    description: Show data management in the sidebar and enable its protected API functions.
