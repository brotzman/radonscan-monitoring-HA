configuration:
  device_name:
    name: Nazwa urządzenia
    description: Nazwa RadonScan wyświetlana w Home Assistant i interfejsie internetowym.
  scan_interval:
    name: Interwał odczytu
    description: Liczba sekund między odczytami SPIR tylko do odczytu.
  preferred_unit:
    name: Preferowana jednostka
    description: Jednostka używana w Home Assistant i interfejsie internetowym.
  language:
    name: Język
    description: Język interfejsu Ingress i połączonego podręcznika.
  warning_threshold_bq_m3:
    name: Próg ostrzegawczy
    description: Wartość radonu w Bq/m³, od której wyświetlany jest stan ostrzegawczy.
  danger_threshold_bq_m3:
    name: Próg zagrożenia
    description: Wartość radonu w Bq/m³, od której wyświetlany jest stan zagrożenia.
  factor_bq_m3_per_cph:
    name: Współczynnik przeliczeniowy CPH
    description: Eksperymentalny współczynnik Bq/m³ na count/h, zapisywany z każdym pomiarem.
  backfill_history:
    name: Importuj historię urządzenia
    description: Importuje zakończone wartości godzinowe zapisane już w urządzeniu po pierwszym udanym odczycie.
  history_retention_days:
    name: Okres przechowywania
    description: Usuwa lokalne pomiary z SQLite po tej liczbie dni.
  serial_port:
    name: Port szeregowy
    description: Pozostaw puste dla automatycznego wykrywania lub podaj stałą ścieżkę urządzenia.
  serial_timeout_seconds:
    name: Limit czasu portu
    description: Maksymalna liczba sekund oczekiwania na odpowiedź urządzenia.
  mqtt_topic_prefix:
    name: Prefiks tematów MQTT
    description: Temat bazowy dla komunikatów stanu i dostępności.
  discovery_prefix:
    name: Prefiks wykrywania
    description: Prefiks tematów Home Assistant MQTT Discovery.
  diagnostic_logging:
    name: Szczegółowe logowanie diagnostyczne
    description: Zapisuje dodatkowe informacje o wykrywaniu portów, odczytach SPIR i dekodowaniu.
  log_level:
    name: Poziom logowania
    description: Szczegółowość dziennika aplikacji.
  minimum_data_coverage_percent:
    name: Minimalne pokrycie danych
    description: Wymagany procent dostępnych wartości godzinowych, zanim średnia zostanie uznana za możliwą do obliczenia.
  report_author:
    name: Autor raportu
    description: Opcjonalna nazwa autora naukowych raportów PDF.
  report_organisation:
    name: Organizacja
    description: Opcjonalna organizacja lub instytucja dla raportów PDF.
  report_disclaimer:
    name: Dodatkowa uwaga w raporcie
    description: Opcjonalna własna uwaga dołączana do naukowych raportów PDF.
  gmcmap_max_age_hours:
    name: Maksymalny wiek danych World Map
    description: Maksymalny wiek pomiarów oczekujących na wysłanie.
  gmcmap_retry_limit:
    name: Limit ponowień World Map
    description: Maksymalna liczba prób przed oznaczeniem pomiaru jako nieudanego.
  analysis_timezone:
    name: Strefa czasowa analizy
    description: Strefa IANA dla profili dziennych, tygodniowych i godzinowych; auto używa Home Assistant.
  gmcmap_enabled:
    name: Włącz GQ World Map
    description: Włącza przesyłanie do GQ Radiation World Map.
  gmcmap_auto_upload:
    name: Automatyczne wysyłanie World Map
    description: Automatycznie dodaje zakończone wartości godzinowe do kolejki.
  gmcmap_account_id:
    name: ID konta GQ World Map
    description: ID konta używane przez usługę wysyłania GQ Radiation World Map.
  gmcmap_device_id:
    name: ID urządzenia GQ World Map
    description: ID urządzenia używane przez usługę wysyłania GQ Radiation World Map.
  gmcmap_upload_interval_minutes:
    name: Interwał wysyłania World Map
    description: Minimalny odstęp w minutach między automatycznymi wysyłkami.
  data_management_enabled:
    name: Włącz zarządzanie danymi
    description: Pokazuje zarządzanie danymi na pasku bocznym i włącza chronione funkcje API.
  homeassistant_access_token:
    name: Token administratora Home Assistant
    description: Opcjonalny długoterminowy token dostępu administratora Home Assistant, używany wyłącznie do usuwania historii Recorder.
  location_display_mode:
    name: Poziom prywatności lokalizacji
    description: Określa, czy przegląd pokazuje adres i dokładne współrzędne, tylko nazwę lokalizacji i zaokrąglone współrzędne, czy nie pokazuje karty lokalizacji.
