configuration:
  device_name:
    name: Nom de l’appareil
    description: Nom du RadonScan affiché dans Home Assistant et l’interface web.
  scan_interval:
    name: Intervalle d’interrogation
    description: Secondes entre deux interrogations SPIR en lecture seule.
  preferred_unit:
    name: Unité préférée
    description: Unité utilisée dans Home Assistant et l’interface web.
  language:
    name: Langue
    description: Langue de l’interface Ingress et du manuel associé.
  warning_threshold_bq_m3:
    name: Seuil d’avertissement
    description: Valeur de radon en Bq/m³ à partir de laquelle l’état d’avertissement est affiché.
  danger_threshold_bq_m3:
    name: Seuil de danger
    description: Valeur de radon en Bq/m³ à partir de laquelle l’état de danger est affiché.
  factor_bq_m3_per_cph:
    name: Facteur de conversion CPH
    description: Facteur expérimental en Bq/m³ par count/h, enregistré avec chaque mesure.
  backfill_history:
    name: Importer l’historique de l’appareil
    description: Importe les valeurs horaires terminées déjà stockées dans l’appareil après la première lecture réussie.
  history_retention_days:
    name: Durée de conservation
    description: Supprime les mesures locales de SQLite après ce nombre de jours.
  serial_port:
    name: Port série
    description: Laisser vide pour la détection automatique ou indiquer un chemin fixe.
  serial_timeout_seconds:
    name: Délai série
    description: Nombre maximal de secondes d’attente d’une réponse de l’appareil.
  mqtt_topic_prefix:
    name: Préfixe des sujets MQTT
    description: Sujet de base pour les messages d’état et de disponibilité.
  discovery_prefix:
    name: Préfixe de découverte
    description: Préfixe utilisé pour les sujets MQTT Discovery de Home Assistant.
  diagnostic_logging:
    name: Journalisation de diagnostic détaillée
    description: Consigne des détails supplémentaires sur la détection des ports, les lectures SPIR et le décodage.
  log_level:
    name: Niveau de journalisation
    description: Niveau de détail du journal de l’application.
  minimum_data_coverage_percent:
    name: Couverture minimale des données
    description: Pourcentage requis de valeurs horaires disponibles avant qu’une moyenne soit considérée calculable.
  report_author:
    name: Auteur du rapport
    description: Nom facultatif de l’auteur des rapports scientifiques PDF.
  report_organisation:
    name: Organisation
    description: Organisation ou établissement facultatif pour les rapports PDF.
  report_disclaimer:
    name: Mention supplémentaire du rapport
    description: Mention personnalisée facultative incluse dans les rapports scientifiques PDF.
  gmcmap_max_age_hours:
    name: Âge maximal des données World Map
    description: Âge maximal des mesures placées en file d’attente pour l’envoi.
  gmcmap_retry_limit:
    name: Limite de tentatives World Map
    description: Nombre maximal de tentatives avant qu’une mesure soit marquée en échec.
  analysis_timezone:
    name: Fuseau horaire d’analyse
    description: Fuseau IANA pour les profils journaliers, hebdomadaires et horaires ; auto utilise Home Assistant.
  gmcmap_enabled:
    name: Activer GQ World Map
    description: Active la transmission vers GQ Radiation World Map.
  gmcmap_auto_upload:
    name: Envoi automatique World Map
    description: Place automatiquement en file d’attente les valeurs horaires terminées.
  gmcmap_account_id:
    name: ID de compte GQ World Map
    description: ID de compte utilisé par le service d’envoi GQ Radiation World Map.
  gmcmap_device_id:
    name: ID d’appareil GQ World Map
    description: ID d’appareil utilisé par le service d’envoi GQ Radiation World Map.
  gmcmap_upload_interval_minutes:
    name: Intervalle d’envoi World Map
    description: Intervalle minimal en minutes entre les envois automatiques.
  data_management_enabled:
    name: Activer la gestion des données
    description: Affiche la gestion des données dans la barre latérale et active ses API protégées.
  homeassistant_access_token:
    name: Jeton administrateur Home Assistant
    description: Jeton d’accès longue durée facultatif d’un administrateur Home Assistant, utilisé uniquement pour supprimer l’historique Recorder.
