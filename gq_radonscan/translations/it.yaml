configuration:
  device_name:
    name: Nome dispositivo
    description: Nome del RadonScan mostrato in Home Assistant e nell’interfaccia web.
  scan_interval:
    name: Intervallo di interrogazione
    description: Secondi tra due interrogazioni SPIR in sola lettura.
  preferred_unit:
    name: Unità preferita
    description: Unità usata in Home Assistant e nell’interfaccia web.
  language:
    name: Lingua
    description: Lingua dell’interfaccia Ingress e del manuale collegato.
  warning_threshold_bq_m3:
    name: Soglia di avviso
    description: Valore di radon in Bq/m³ dal quale viene mostrato lo stato di avviso.
  danger_threshold_bq_m3:
    name: Soglia di pericolo
    description: Valore di radon in Bq/m³ dal quale viene mostrato lo stato di pericolo.
  factor_bq_m3_per_cph:
    name: Fattore di conversione CPH
    description: Fattore sperimentale in Bq/m³ per count/h, salvato con ogni misura.
  backfill_history:
    name: Importa cronologia dispositivo
    description: Importa i valori orari completati già memorizzati nel dispositivo dopo la prima lettura riuscita.
  history_retention_days:
    name: Periodo di conservazione
    description: Rimuove le misure locali da SQLite dopo questo numero di giorni.
  serial_port:
    name: Porta seriale
    description: Usare il percorso fisso del RadonScan; inserire auto solo per attivare deliberatamente il rilevamento.
  serial_timeout_seconds:
    name: Timeout seriale
    description: Numero massimo di secondi di attesa per una risposta del dispositivo.
  mqtt_topic_prefix:
    name: Prefisso argomenti MQTT
    description: Argomento base per messaggi di stato e disponibilità.
  discovery_prefix:
    name: Prefisso Discovery
    description: Prefisso usato per gli argomenti MQTT Discovery di Home Assistant.
  diagnostic_logging:
    name: Registrazione diagnostica dettagliata
    description: Registra dettagli aggiuntivi su rilevamento porte, letture SPIR e decodifica.
  log_level:
    name: Livello di registrazione
    description: Quantità di dettagli nel registro dell’app.
  minimum_data_coverage_percent:
    name: Copertura dati minima
    description: Percentuale richiesta di valori orari disponibili prima che una media sia considerata calcolabile.
  report_author:
    name: Autore del rapporto
    description: Nome facoltativo dell’autore per i rapporti scientifici PDF.
  report_organisation:
    name: Organizzazione
    description: Organizzazione o istituto facoltativo per i rapporti PDF.
  report_disclaimer:
    name: Nota aggiuntiva del rapporto
    description: Nota personalizzata facoltativa inclusa nei rapporti scientifici PDF.
  gmcmap_max_age_hours:
    name: Età massima dati World Map
    description: Età massima delle misure in coda per il caricamento.
  gmcmap_retry_limit:
    name: Limite tentativi World Map
    description: Numero massimo di tentativi prima che una misura sia contrassegnata come fallita.
  analysis_timezone:
    name: Fuso orario di analisi
    description: Fuso IANA per profili giornalieri, settimanali e orari; auto usa Home Assistant.
  gmcmap_enabled:
    name: Attiva GQ World Map
    description: Attiva la trasmissione a GQ Radiation World Map.
  gmcmap_auto_upload:
    name: Caricamento automatico World Map
    description: Mette automaticamente in coda i valori orari completati.
  gmcmap_account_id:
    name: ID account GQ World Map
    description: ID account usato dal servizio di caricamento GQ Radiation World Map.
  gmcmap_device_id:
    name: ID dispositivo GQ World Map
    description: ID dispositivo usato dal servizio di caricamento GQ Radiation World Map.
  gmcmap_upload_interval_minutes:
    name: Intervallo caricamento World Map
    description: Intervallo minimo in minuti tra i caricamenti automatici.
  data_management_enabled:
    name: Attiva gestione dati
    description: Mostra la gestione dati nella barra laterale e abilita le API protette.
  homeassistant_access_token:
    name: Token amministratore Home Assistant
    description: Token di accesso a lunga durata facoltativo di un amministratore Home Assistant, usato solo per eliminare la cronologia Recorder.
  location_display_mode:
    name: Livello di privacy della posizione
    description: Stabilisce se la panoramica mostra indirizzo e coordinate precise, solo il nome del luogo e coordinate arrotondate oppure nessuna scheda della posizione.
