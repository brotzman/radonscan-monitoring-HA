configuration:
  device_name:
    name: Apparaatnaam
    description: Weergavenaam van de RadonScan in Home Assistant en de webinterface.
  scan_interval:
    name: Uitleesinterval
    description: Seconden tussen alleen-lezen SPIR-uitlezingen.
  preferred_unit:
    name: Voorkeurseenheid
    description: Eenheid voor Home Assistant en de webinterface.
  language:
    name: Taal
    description: Taal van de Ingress-interface en de gekoppelde handleiding.
  warning_threshold_bq_m3:
    name: Waarschuwingsdrempel
    description: Radonwaarde in Bq/m³ waarbij de waarschuwingsstatus wordt getoond.
  danger_threshold_bq_m3:
    name: Gevaardrempel
    description: Radonwaarde in Bq/m³ waarbij de gevaarstatus wordt getoond.
  factor_bq_m3_per_cph:
    name: CPH-omrekenfactor
    description: Experimentele factor in Bq/m³ per count/h; wordt bij elke meting opgeslagen.
  backfill_history:
    name: Apparaatgeschiedenis importeren
    description: Importeert voltooide uurwaarden die al in het apparaat staan na de eerste geslaagde uitlezing.
  history_retention_days:
    name: Bewaartermijn
    description: Verwijdert lokale metingen uit SQLite na dit aantal dagen.
  serial_port:
    name: Seriële poort
    description: Gebruik het vaste RadonScan-pad; voer auto alleen in om detectie bewust in te schakelen.
  serial_timeout_seconds:
    name: Seriële time-out
    description: Maximaal aantal seconden om op een apparaatantwoord te wachten.
  mqtt_topic_prefix:
    name: MQTT-onderwerpprefix
    description: Basisonderwerp voor status- en beschikbaarheidsmeldingen.
  discovery_prefix:
    name: Discovery-prefix
    description: Prefix voor Home Assistant MQTT Discovery-onderwerpen.
  diagnostic_logging:
    name: Uitgebreide diagnostische logging
    description: Logt extra details over poortdetectie, SPIR-uitlezingen en decodering.
  log_level:
    name: Logniveau
    description: Mate van detail in het app-logboek.
  minimum_data_coverage_percent:
    name: Minimale gegevensdekking
    description: Vereist percentage beschikbare uurwaarden voordat een periodegemiddelde berekenbaar wordt geacht.
  report_author:
    name: Rapportauteur
    description: Optionele auteursnaam voor wetenschappelijke PDF-rapporten.
  report_organisation:
    name: Organisatie
    description: Optionele organisatie of instelling voor PDF-rapporten.
  report_disclaimer:
    name: Aanvullende rapportnotitie
    description: Optionele eigen notitie in wetenschappelijke PDF-rapporten.
  gmcmap_max_age_hours:
    name: Maximale gegevensleeftijd World Map
    description: Maximale leeftijd van metingen in de uploadwachtrij.
  gmcmap_retry_limit:
    name: Limiet World Map-pogingen
    description: Maximaal aantal uploadpogingen voordat een meting als mislukt geldt.
  analysis_timezone:
    name: Analysetijdzone
    description: IANA-tijdzone voor dag-, weekdag- en uurprofielen; auto gebruikt Home Assistant.
  gmcmap_enabled:
    name: GQ World Map inschakelen
    description: Schakelt verzending naar GQ Radiation World Map in.
  gmcmap_auto_upload:
    name: Automatische World Map-upload
    description: Zet voltooide uurwaarden automatisch in de uploadwachtrij.
  gmcmap_account_id:
    name: GQ World Map-account-ID
    description: Account-ID voor de uploadservice van GQ Radiation World Map.
  gmcmap_device_id:
    name: GQ World Map-apparaat-ID
    description: Apparaat-ID voor de uploadservice van GQ Radiation World Map.
  gmcmap_upload_interval_minutes:
    name: World Map-uploadinterval
    description: Minimale tijd in minuten tussen automatische uploads.
  data_management_enabled:
    name: Gegevensbeheer inschakelen
    description: Toont gegevensbeheer in de zijbalk en schakelt de beveiligde API-functies in.
  homeassistant_access_token:
    name: Home Assistant-beheerderstoken
    description: Optioneel langlevend toegangstoken van een Home Assistant-beheerder, uitsluitend gebruikt om Recorder-geschiedenis te verwijderen.
  location_display_mode:
    name: Privacyniveau van locatie
    description: Bepaalt of het overzicht het adres en nauwkeurige coördinaten, alleen de locatienaam en afgeronde coördinaten, of geen locatiekaart toont.
