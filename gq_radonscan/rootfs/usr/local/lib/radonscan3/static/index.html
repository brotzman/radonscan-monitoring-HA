<!doctype html>
<html lang="__LOCALE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Radon Monitoring</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="assets/app.css?v=__VERSION__">
</head>
<body>
  <a class="skip-link" href="#mainContent" data-i18n="skip_to_content">Skip to content</a>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/icon.png" alt="" class="brand-icon">
        <div><strong>Radon Monitoring</strong><small>v__VERSION__</small></div>
      </div>
      <nav class="side-nav" data-i18n-aria-label="main_navigation" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span data-i18n="overview"></span></button>
        <button class="nav-item" data-view="analysis"><span class="nav-icon">⌁</span><span data-i18n="analysis"></span></button>
        <button class="nav-item" data-view="sites"><span class="nav-icon">⌖</span><span data-i18n="sites_events_nav"></span></button>
        <div class="nav-separator"></div>
        <button id="gmcmapNav" class="nav-item" data-view="map"><span class="nav-icon">◎</span><span data-i18n="gmcmap_nav"></span></button>
        <button class="nav-item" data-view="history"><span class="nav-icon">≋</span><span data-i18n="history"></span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span><span data-i18n="reports"></span></button>
        <button id="dataManagementNav" class="nav-item" data-view="data"><span class="nav-icon">◫</span><span data-i18n="data_management"></span></button>
        <div class="nav-separator"></div>
        <button class="nav-item" data-view="system"><span class="nav-icon">◉</span><span data-i18n="device_system"></span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span data-i18n="settings"></span></button>
        <button class="nav-item" data-view="help"><span class="nav-icon">?</span><span data-i18n="help"></span></button>
      </nav>
      <div class="sidebar-footer">
        <span id="sidebarConnectionDot" class="status-dot"></span>
        <span id="sidebarConnection" data-i18n="loading"></span>
      </div>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <button id="menuButton" class="icon-button menu-button" data-i18n-aria-label="menu" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div class="page-brand">
          <h1 data-i18n="app_title">Radon Monitoring</h1>
          <p data-i18n="app_subtitle">Lokale Überwachung für GQ RadonScan Geräte</p>
        </div>
        <div class="top-actions">
          <div id="connectionPill" class="status-pill neutral"><span class="status-dot"></span><span data-i18n="loading"></span></div>
          <select id="languageSelect" data-i18n-aria-label="language" aria-label="Language"></select>
          <button id="refreshButton" class="icon-button" data-i18n-title="refresh" data-i18n-aria-label="refresh" aria-label="Refresh">↻</button>
        </div>
      </header>

      <main id="mainContent" tabindex="-1">
        <section id="view-overview" class="view active">
          <article class="panel filter-panel overview-filter-panel" aria-labelledby="overviewContextTitle">
            <div class="panel-heading compact">
              <div><span class="eyebrow" data-i18n="overview_context"></span><h2 id="overviewContextTitle" data-i18n="overview_selection"></h2><p id="overviewSelectionSummary" data-i18n="overview_selection_hint"></p></div>
            </div>
            <div class="filter-grid overview-filter-grid overview-filter-grid-compact">
              <label><span data-i18n="device"></span><select id="overviewDevice"></select></label>
              <label><span data-i18n="campaign"></span><select id="overviewCampaign"></select></label>
              <button id="overviewApply" class="button primary align-end" data-i18n="apply_selection"></button>
            </div>
          </article>
          <div class="hero-grid">
            <article class="primary-card" id="currentCard">
              <div class="card-kicker"><span data-i18n="hourly_value"></span><span id="currentStatus" class="badge neutral" data-i18n="unknown"></span></div>
              <div class="radon-reading"><span id="currentValue">–</span><span id="currentUnit">Bq/m³</span></div>
              <div class="reading-meta"><span id="currentTime">–</span><span id="currentAge">–</span></div>
              <div class="micro-grid micro-grid-two">
                <div><span data-i18n="raw_cph"></span><strong id="currentRaw">–</strong></div>
                <div><span data-i18n="sample_count"></span><strong id="sampleCount">0</strong></div>
              </div>
            </article>
            <article class="system-card">
              <div class="panel-heading compact"><div><span class="eyebrow" data-i18n="system_status"></span><h2 data-i18n="health"></h2></div><span id="qualityBadge" class="badge neutral">–</span></div>
              <div class="status-list">
                <div><span data-i18n="device_connection"></span><strong id="overviewDeviceStatus">–</strong></div>
                <div><span data-i18n="mqtt"></span><strong id="overviewMqttStatus">–</strong></div>
                <div><span data-i18n="last_device_read"></span><strong id="overviewLastDeviceRead">–</strong></div>
                <div><span data-i18n="last_completed_measurement"></span><strong id="overviewLastMeasurement">–</strong></div>
                <div><span data-i18n="database"></span><strong id="overviewDatabaseStatus">–</strong></div>
                <div><span data-i18n="coverage_30d"></span><strong id="overviewCoverage">–</strong></div>
              </div>
            </article>
          </div>

          <div class="overview-context-grid">
            <article class="panel ha-location-panel" id="homeAssistantLocationCard" aria-labelledby="homeAssistantLocationTitle">
              <div class="ha-location-layout">
                <div class="ha-location-icon" aria-hidden="true">⌖</div>
                <div class="ha-location-copy">
                  <h2 id="homeAssistantLocationTitle" data-i18n="ha_location_title"></h2>
                  <p id="homeAssistantLocationAddress" class="ha-location-address">–</p>
                  <p id="homeAssistantLocationDetails" class="ha-location-details">–</p>
                  <p id="homeAssistantRoom" class="ha-location-room"><span data-i18n="room"></span>: <strong>–</strong></p>
                  <p class="ha-location-privacy"><span data-i18n="ha_location_privacy"></span> <span id="homeAssistantLocationPrivacyMode" class="privacy-mode-label"></span></p>
                </div>
              </div>
            </article>

            <article class="panel radon-traffic-panel neutral" id="radonTrafficCard" aria-labelledby="radonTrafficTitle">
              <div class="panel-heading compact">
                <h2 id="radonTrafficTitle" data-i18n="radon_traffic_title"></h2>
                <span id="radonTrafficStatus" class="badge neutral" data-i18n="unknown"></span>
              </div>
              <div class="radon-traffic-layout">
                <div id="radonTrafficSignal" class="radon-traffic-signal" role="img" aria-label="">
                  <span class="radon-traffic-light danger" data-level="danger" aria-hidden="true"></span>
                  <span class="radon-traffic-light warning" data-level="warning" aria-hidden="true"></span>
                  <span class="radon-traffic-light normal" data-level="normal" aria-hidden="true"></span>
                </div>
                <div class="radon-traffic-copy">
                  <p id="radonTrafficValue" class="radon-traffic-value">–</p>
                  <p id="radonTrafficBasis" class="radon-traffic-basis">–</p>
                  <p id="radonTrafficThresholds" class="radon-traffic-thresholds">–</p>
                  <p class="radon-traffic-hint" data-i18n="radon_traffic_hint"></p>
                </div>
              </div>
            </article>
          </div>

          <div class="metric-grid">
            <article class="metric-card" id="metric24"><span data-i18n="average_24h"></span><strong id="avg24">–</strong><small id="coverage24">–</small></article>
            <article class="metric-card" id="metric7d"><span data-i18n="average_7d"></span><strong id="avg7d">–</strong><small id="coverage7d">–</small></article>
            <article class="metric-card" id="metric30d"><span data-i18n="average_30d"></span><strong id="avg30d">–</strong><small id="coverage30d">–</small></article>
            <article class="metric-card" id="metricPeak24"><span data-i18n="maximum_24h"></span><strong id="peak24">–</strong><small id="peak24Time">–</small></article>
          </div>

          <article class="panel chart-panel">
            <div class="panel-heading">
              <div><span class="eyebrow" data-i18n="local_data"></span><h2 data-i18n="chart_title"></h2><p id="chartSubtitle">–</p></div>
              <div class="range-switch" id="rangeSwitch">
                <button data-days="1" data-i18n="show_24h"></button>
                <button data-days="7" class="active" data-i18n="show_7d"></button>
                <button data-days="30" data-i18n="show_30d"></button>
                <button data-days="0" data-i18n="show_all"></button>
              </div>
            </div>
            <div id="chart" class="chart"><div class="empty" data-i18n="chart_empty"></div></div>
            <div class="chart-legend"><span><i class="legend-line"></i><span data-i18n="hourly_measurement"></span></span><span><i class="legend-warning"></i><span data-i18n="warning_threshold"></span></span><span><i class="legend-danger"></i><span data-i18n="danger_threshold"></span></span><span><i class="legend-event"></i><span data-i18n="documented_events"></span></span></div>
          </article>
        </section>

        <section id="view-analysis" class="view">
          <div class="section-header"><div><span class="eyebrow" data-i18n="statistical_evaluation"></span><h2 data-i18n="analysis_title"></h2><p data-i18n="analysis_hint"></p></div></div>
          <article class="panel filter-panel">
            <div class="filter-grid">
              <label><span data-i18n="period"></span><select id="analysisPreset"><option value="1" data-i18n="last_24h"></option><option value="7" data-i18n="last_7d"></option><option value="30" selected data-i18n="last_30d"></option><option value="90" data-i18n="last_90d"></option><option value="365" data-i18n="last_365d"></option><option value="custom" data-i18n="custom"></option></select></label>
              <label><span data-i18n="device"></span><select id="analysisDevice"></select></label>
              <label><span data-i18n="start"></span><input type="datetime-local" id="analysisStart"></label>
              <label><span data-i18n="end"></span><input type="datetime-local" id="analysisEnd"></label>
              <label><span data-i18n="measurement_site"></span><select id="analysisLocation"></select></label>
              <label><span data-i18n="campaign"></span><select id="analysisCampaign"></select></label>
              <button id="analysisApply" class="button primary align-end" data-i18n="apply"></button>
            </div>
          </article>
          <article id="analysisSummary" class="panel analysis-summary" aria-live="polite"><span class="eyebrow" data-i18n="analysis_summary"></span><p id="analysisSummaryText">–</p></article>
          <div id="analysisNotice" class="notice hidden"></div>

          <div class="analysis-level-heading"><h3 data-i18n="concentration_level"></h3><p data-i18n="concentration_level_hint"></p></div>
          <article class="panel"><dl id="analysisConcentrationFacts" class="facts-grid"></dl></article>

          <div class="analysis-level-heading"><h3 data-i18n="thresholds_and_exceedances"></h3><p data-i18n="thresholds_and_exceedances_hint"></p></div>
          <article class="panel"><dl id="analysisThresholdFacts" class="facts-grid"></dl></article>

          <div class="two-column wide-left">
            <article class="panel"><div class="panel-heading"><h3 data-i18n="time_series"></h3><span id="analysisPeriodLabel" class="muted">–</span></div><div id="analysisChart" class="chart compact-chart"></div><div class="chart-legend compact"><span><i class="legend-event"></i><span data-i18n="documented_events"></span></span></div></article>
            <article class="panel"><div class="panel-heading"><div><h3 data-i18n="distribution"></h3><p data-i18n="distribution_hint"></p></div></div><div id="histogramChart" class="chart compact-chart"></div></article>
          </div>

          <div class="analysis-level-heading"><h3 data-i18n="distribution_and_variability"></h3><p data-i18n="distribution_and_variability_hint"></p></div>
          <article class="panel"><dl id="analysisDistributionFacts" class="facts-grid"></dl></article>

          <div class="analysis-level-heading"><h3 data-i18n="development_and_comparison"></h3><p data-i18n="development_and_comparison_hint"></p></div>
          <article class="panel"><dl id="analysisTrendFacts" class="facts-grid"></dl></article>

          <article class="panel"><div class="panel-heading"><div><h3 data-i18n="weekly_heatmap"></h3><p data-i18n="heatmap_hint"></p></div></div><div id="weeklyHeatmap" class="heatmap"></div></article>

          <div class="analysis-level-heading"><h3 data-i18n="data_quality"></h3><p data-i18n="data_quality_hint_extended"></p></div>
          <article class="panel"><dl id="analysisQualityFacts" class="facts-grid"></dl></article>

          <div class="analysis-level-heading"><h3 data-i18n="event_impact"></h3><p data-i18n="event_impact_hint"></p></div>
          <article class="panel"><dl id="analysisEventImpactFacts" class="facts-grid"></dl><div id="analysisEventImpactNote" class="notice info"></div></article>

          <details id="analysisAdvanced" class="analysis-advanced">
            <summary><span><strong data-i18n="advanced_statistics"></strong><small data-i18n="advanced_statistics_hint"></small></span><span class="details-chevron" aria-hidden="true">⌄</span></summary>
            <div class="analysis-metrics advanced-metrics">
              <article class="metric-card"><span data-i18n="scientific_quality"></span><strong id="analysisScienceClass">–</strong><small id="analysisQcStatus">–</small></article>
              <article class="metric-card"><span data-i18n="measurement_uncertainty"></span><strong id="analysisUncertainty">–</strong><small id="analysisUncertaintyNote">–</small></article>
              <article class="metric-card"><span data-i18n="effective_sample_size"></span><strong id="analysisEffectiveN">–</strong><small id="analysisCorrelation">–</small></article>
              <article class="metric-card"><span data-i18n="confidence_interval"></span><strong id="analysisMeanCi">–</strong><small data-i18n="block_bootstrap"></small></article>
            </div>
            <div class="two-column">
              <article class="panel"><h3 data-i18n="scientific_interpretation"></h3><dl id="scientificFacts" class="facts-grid"></dl><div id="scientificNotice" class="notice info"></div></article>
              <article class="panel"><h3 data-i18n="distribution_diagnostics"></h3><dl id="distributionFacts" class="facts-grid"></dl></article>
              <article class="panel"><h3 data-i18n="threshold_events"></h3><dl id="thresholdEventFacts" class="facts-grid"></dl></article>
              <article class="panel"><h3 data-i18n="sensitivity_analysis"></h3><dl id="sensitivityFacts" class="facts-grid"></dl></article>
            </div>
          </details>
          <article class="panel"><div class="panel-heading"><h3 data-i18n="daily_statistics"></h3><button id="analysisCsvButton" class="button secondary" data-i18n="export_csv"></button></div><div class="table-wrap"><table><thead><tr><th data-i18n="date"></th><th data-i18n="samples"></th><th data-i18n="coverage"></th><th data-i18n="minimum"></th><th data-i18n="median"></th><th data-i18n="maximum"></th><th data-i18n="mean"></th></tr></thead><tbody id="dailyBody"></tbody></table></div></article>
        </section>

        <section id="view-sites" class="view">
          <div class="section-header"><div><span class="eyebrow" data-i18n="local_metadata"></span><h2 data-i18n="sites_events_title"></h2><p data-i18n="sites_events_hint"></p></div></div>
          <article class="panel ha-source-panel" aria-labelledby="haRoomSourceTitle">
            <div class="panel-heading compact"><div><span class="eyebrow" data-i18n="automatic_from_ha"></span><h3 id="haRoomSourceTitle" data-i18n="ha_room_source_title"></h3><p data-i18n="ha_room_source_hint"></p></div><span id="haRoomSourceStatus" class="badge neutral">–</span></div>
            <dl class="ha-source-facts">
              <div><dt data-i18n="building"></dt><dd id="haRoomBuilding">–</dd></div>
              <div><dt data-i18n="place_address"></dt><dd id="haRoomPlace">–</dd></div>
            </dl>
          </article>
          <div class="two-column workflow-grid">
            <article class="panel workflow-step" data-step="1">
              <div class="workflow-heading"><span class="workflow-number">1</span><div><h3 data-i18n="create_room_step"></h3><p class="field-help" data-i18n="room_form_hint"></p></div></div>
              <form id="locationForm" class="form-stack" novalidate>
                <input type="hidden" id="locationId" name="id">
                <label><span data-i18n="room"></span><input id="locationRoom" name="room" required autocomplete="off" maxlength="120" aria-describedby="locationRoomHelp locationRoomError"><small id="locationRoomHelp" class="field-help" data-i18n="room_field_help"></small><small id="locationRoomError" class="field-error" role="alert" hidden></small></label>
                <label><span data-i18n="measurement_height"></span><input id="locationHeight" name="measurement_height_m" type="number" min="0" max="10" step="0.1" inputmode="decimal" aria-describedby="locationHeightHelp locationHeightError"><small id="locationHeightHelp" class="field-help" data-i18n="measurement_height_help"></small><small id="locationHeightError" class="field-error" role="alert" hidden></small></label>
                <div class="button-row"><button id="saveRoomButton" class="button primary" type="submit" data-i18n="save_site"></button><button id="cancelRoomEdit" class="button secondary" type="button" data-i18n="cancel_edit" hidden></button></div>
                <p id="locationFormStatus" class="form-status" aria-live="polite" hidden></p>
              </form>
            </article>
            <article id="assignmentPanel" class="panel workflow-step" data-step="2">
              <div class="workflow-heading"><span class="workflow-number">2</span><div><h3 data-i18n="assign_measurements"></h3><p class="field-help" data-i18n="assignment_step_hint"></p></div></div>
              <div id="assignEmptyNotice" class="notice info" data-i18n="assignment_requires_room"></div>
              <form id="assignForm" class="form-stack" novalidate>
                <fieldset id="assignFieldset" class="form-fieldset" disabled>
                  <label><span data-i18n="device"></span><select id="assignDevice" required></select></label>
                  <label><span data-i18n="room"></span><select id="assignLocation" required aria-describedby="assignLocationError"></select><small id="assignLocationError" class="field-error" role="alert" hidden></small></label>
                  <label><span data-i18n="session_title"></span><input id="assignTitle" required aria-describedby="assignTitleError"><small id="assignTitleError" class="field-error" role="alert" hidden></small></label>
                  <div class="two-field"><label><span data-i18n="start"></span><input id="assignStart" type="datetime-local" required aria-describedby="assignStartError"><small id="assignStartError" class="field-error" role="alert" hidden></small></label><label><span data-i18n="end_optional"></span><input id="assignEnd" type="datetime-local" aria-describedby="assignEndError"><small id="assignEndError" class="field-error" role="alert" hidden></small></label></div>
                  <label><span data-i18n="purpose"></span><input id="assignPurpose"></label>
                  <label><span data-i18n="notes"></span><textarea id="assignNotes" rows="2"></textarea></label>
                  <button id="assignButton" type="submit" class="button primary" data-i18n="assign"></button>
                </fieldset>
                <p id="assignFormStatus" class="form-status" aria-live="polite" hidden></p>
              </form>
            </article>
          </div>
          <article class="panel"><div class="panel-heading"><div><h3 data-i18n="measurement_sites"></h3><p data-i18n="rooms_list_hint"></p></div><span id="locationCount" class="muted">0</span></div><div id="locationCards" class="location-grid"></div></article>
          <article class="panel"><div class="panel-heading"><div><h3 data-i18n="measurement_assignments"></h3><p data-i18n="measurement_assignments_hint"></p></div><span id="assignmentCount" class="muted">0</span></div><div id="assignmentList" class="assignment-list"></div></article>
          <div class="two-column"><article class="panel"><h3 data-i18n="add_event"></h3><form id="eventForm" class="form-stack" novalidate><div class="two-field"><label><span data-i18n="event_type"></span><select id="eventType"><option value="ventilation" data-i18n="ventilation"></option><option value="window" data-i18n="window"></option><option value="construction" data-i18n="construction"></option><option value="device_move" data-i18n="device_move"></option><option value="outage" data-i18n="outage"></option><option value="note" data-i18n="note"></option></select></label><label><span data-i18n="time"></span><input id="eventTime" type="datetime-local" required aria-describedby="eventTimeError"><small id="eventTimeError" class="field-error" role="alert" hidden></small></label></div><label><span data-i18n="room"></span><select id="eventLocation"></select></label><label><span data-i18n="title"></span><input id="eventTitle" required aria-describedby="eventTitleError"><small id="eventTitleError" class="field-error" role="alert" hidden></small></label><label><span data-i18n="notes"></span><textarea id="eventNotes" rows="2"></textarea></label><button type="submit" class="button primary" data-i18n="save_event"></button><p id="eventFormStatus" class="form-status" aria-live="polite" hidden></p></form></article><article class="panel"><div class="panel-heading"><h3 data-i18n="events"></h3><span id="eventCount" class="muted">0</span></div><div id="eventList" class="event-list"></div></article></div>
        </section>

        <section id="view-map" class="view gmcmap-view">
          <div class="section-header gmcmap-header"><div><span class="eyebrow" data-i18n="external_data_sharing"></span><h2 data-i18n="gmcmap_title"></h2><p data-i18n="gmcmap_hint"></p></div><a class="button secondary" href="https://www.gmcmap.com/" target="_blank" rel="noopener noreferrer" data-i18n="open_gmcmap"></a></div>
          <div class="two-column">
            <article class="panel">
              <div class="panel-heading gmcmap-connection-heading"><div><h3 data-i18n="gmcmap_connection"></h3><p data-i18n="gmcmap_config_hint"></p></div><span id="gmcmapStatusBadge" class="badge neutral">–</span></div>
              <dl id="gmcmapFacts" class="facts-panel"></dl>
              <div id="gmcmapNotice" class="notice warning"></div>
            </article>
            <article class="panel">
              <h3 data-i18n="manual_upload"></h3>
              <p data-i18n="manual_upload_hint"></p>
              <div class="upload-preview">
                <span data-i18n="latest_measurement"></span>
                <strong id="gmcmapLatestValue">–</strong>
                <small id="gmcmapLatestTime">–</small>
              </div>
              <label><span data-i18n="confirmation"></span><input id="gmcmapConfirmation" data-i18n-placeholder="confirm_upload_word" placeholder="HOCHLADEN"></label>
              <div class="button-row"><button id="gmcmapUploadButton" class="button primary" data-i18n="upload_now"></button><button id="gmcmapRetryButton" class="button secondary" data-i18n="retry_failed_uploads"></button></div>
            </article>
          </div>
          <article class="panel">
            <h3 data-i18n="gmcmap_privacy_title"></h3>
            <div class="notice-list"><p data-i18n="gmcmap_privacy_1"></p><p data-i18n="gmcmap_privacy_2"></p><p data-i18n="gmcmap_protocol_note"></p></div>
          </article>
          <article class="panel"><div class="panel-heading"><h3 data-i18n="upload_history"></h3><button id="refreshGmcmap" class="button secondary" data-i18n="refresh"></button></div><div class="table-wrap"><table><thead><tr><th data-i18n="time"></th><th data-i18n="measurement_time"></th><th>Bq/m³</th><th>pCi/L</th><th data-i18n="trigger"></th><th data-i18n="status"></th><th data-i18n="response"></th></tr></thead><tbody id="gmcmapHistoryBody"></tbody></table></div></article>

        </section>

        <section id="view-history" class="view">
          <div class="section-header"><div><span class="eyebrow" data-i18n="hourly_data"></span><h2 data-i18n="history_title"></h2><p data-i18n="accuracy_note"></p></div></div>
