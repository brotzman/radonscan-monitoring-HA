[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radon-monitoring-repository"
version = "5.5.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["gq_radonscan/rootfs/usr/local/lib"]
testpaths = ["gq_radonscan/tests"]
addopts = "-ra"
